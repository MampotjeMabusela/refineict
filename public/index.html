<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refine ICT — Managed IT, Cloud & Cybersecurity</title>
<meta name="description" content="Managed IT support, cybersecurity, cloud, networking and software development for growing businesses in Pretoria and beyond.">
<link rel="canonical" href="https://refineict.co.za/">
<meta property="og:type" content="website">
<meta property="og:title" content="Refine ICT — Managed IT, Cloud & Cybersecurity">
<meta property="og:description" content="Fixed-price IT support, cloud, security and software for businesses that can't afford downtime.">
<meta property="og:url" content="https://refineict.co.za/">
<meta property="og:image" content="https://refineict.co.za/img/hero-bg.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Refine ICT — Managed IT, Cloud & Cybersecurity">
<meta name="twitter:description" content="Fixed-price IT support, cloud, security and software for businesses that can't afford downtime.">
<meta name="twitter:image" content="https://refineict.co.za/img/hero-bg.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script>
  (function () {
    var t = localStorage.getItem('theme');
    if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if (t) document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
<section class="hero hero--cinema" id="hero">
  <div class="hero-bg" aria-hidden="true">
    <picture>
      <source id="hero-bg-webp" type="image/webp">
      <img id="img-hero" alt="" width="2560" height="1440" fetchpriority="high">
    </picture>
  </div>
  <div class="hero-content">
    <div class="hero-text">
      <p class="hero-brand" id="hero-brand"></p>
      <h1 id="h-tagline"></h1>
      <p id="h-lead"></p>
      <div class="cta">
        <a href="/contact.html" class="btn" id="cta-assess"></a>
        <a href="/services.html" class="btn btn-ghost btn-ghost-light" id="cta-services"></a>
      </div>
    </div>
    <div class="hero-visual hero-visual--overlay" aria-hidden="true">
      <svg class="topo" viewBox="0 0 400 300">
        <g stroke="#7fa2ff" stroke-width="1.2" fill="none" opacity=".7">
          <path d="M60 220 L150 120 L260 170 L340 70"/>
          <path d="M150 120 L200 40 L260 170"/>
          <path d="M60 220 L260 170"/>
        </g>
        <g fill="#fff">
          <circle cx="60" cy="220" r="6"/><circle cx="150" cy="120" r="6"/>
          <circle cx="260" cy="170" r="6"/><circle cx="340" cy="70" r="6"/>
          <circle cx="200" cy="40" r="6"/>
        </g>
        <circle class="pulse" cx="150" cy="120" r="6"/>
      </svg>
      <div class="status"><i></i> <span id="status-line"></span></div>
    </div>
  </div>
</section>

<section class="stats" id="stats" aria-label="Company statistics"></section>

<section class="sec" id="services">
  <h2>Every IT service your business depends on</h2>
  <p class="lead" id="services-intro"></p>
  <div class="grid" id="service-grid" data-limit="6"></div>
  <p style="margin-top:1.5rem"><a class="btn btn-ghost" href="/services.html" id="cta-view-all"></a></p>
</section>

<section class="sec" id="industries-section">
  <h2>Industries we serve</h2>
  <p class="lead" id="industries-intro"></p>
  <div class="grid" id="industries"></div>
</section>

<section class="sec" id="partners-section">
  <h2>Certifications &amp; partners</h2>
  <p class="lead" id="partners-intro"></p>
  <div class="partners" id="partners"></div>
</section>

<section class="sec split" id="about">
  <img id="img-about" alt="" width="2400" height="1310" loading="lazy">
  <div>
    <h2 id="about-title"></h2>
    <p id="about-lead"></p>
    <ul class="ticks" id="about-points"></ul>
  </div>
</section>

<section class="band" id="security">
  <div class="split">
    <div>
      <h2 id="security-title"></h2>
      <p id="security-lead"></p>
      <a href="/contact.html" class="btn btn-light" id="security-cta"></a>
    </div>
    <img id="img-security" class="band-media" alt="" width="2400" height="1310" loading="lazy">
  </div>
</section>

<section class="sec" id="process">
  <h2>How we work</h2>
  <ol class="steps" id="steps"></ol>
</section>

<section class="sec" id="pricing">
  <h2>Support plans</h2>
  <p class="lead" id="plans-intro"></p>
  <div class="plans" id="plans"></div>
</section>

<section class="sec" id="cases-section">
  <h2>Case studies</h2>
  <p class="lead" id="cases-intro"></p>
  <div class="grid" id="cases"></div>
</section>

<section class="sec quotes" id="quotes" aria-label="Client testimonials"></section>

<section class="sec faq-sec" id="faq-section" aria-labelledby="faq-title">
  <div class="faq-layout">
    <div class="faq-main">
      <h2 id="faq-title">FAQ</h2>
      <div class="faq" id="faq"></div>
    </div>
    <figure class="faq-media">
      <picture>
        <source srcset="/img/faq.webp" type="image/webp">
        <img src="/img/faq.png" alt="Frequently asked questions — person reviewing FAQ information on a screen" width="2400" height="1646" loading="lazy">
      </picture>
    </figure>
  </div>
</section>

<section class="sec" id="news">
  <h2>News &amp; notes</h2>
  <p class="lead" id="blog-intro"></p>
  <div class="grid" id="posts"></div>
</section>

<section class="sec contact" id="contact">
  <div>
    <h2>Tell us what you need</h2>
    <p class="lead" id="contact-intro"></p>
    <address id="contact-info"></address>
  </div>
  <form id="form" novalidate>
    <label for="name">Name<input id="name" name="name" required autocomplete="name"></label>
    <label for="email">Email<input id="email" name="email" type="email" required autocomplete="email"></label>
    <label for="phone">Phone<input id="phone" name="phone" type="tel" autocomplete="tel"></label>
    <label for="service-select">Service<select name="service" id="service-select"></select></label>
    <label for="message">How can we help?<textarea id="message" name="message" rows="4" required minlength="10"></textarea></label>
    <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn" type="submit">Send request</button>
    <p id="form-msg" class="form-msg" role="status"></p>
  </form>
</section>
</main>

<div id="site-footer"></div>
<script src="/config.js"></script>
<script src="/js/include.js"></script>
<script src="/js/app.js"></script>
<script src="/js/kat.js"></script>
</body>
</html>
